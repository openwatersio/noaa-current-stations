name: publish
on:
  release:
    types: [published]
permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC)
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: npm test
      # The bootstrap version is published by hand because a new package can't have a
      # trusted publisher configured before it exists. The matching GitHub release still
      # attaches the bundle, so skip its duplicate registry publish.
      - id: published
        run: |
          V=$(node -p "require('./package.json').version")
          N=$(node -p "require('./package.json').name")
          if npm view "$N@$V" version >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "$N@$V is already on npm — nothing to publish."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.published.outputs.skip == 'false'
        run: npm publish
